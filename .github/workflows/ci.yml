name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend syntax (node --check，零构建也要守语法门)
        run: for f in src/gpm/webui/static/gpm-*.js; do node --check "$f"; done
        shell: bash   # windows-latest 默认 pwsh，不声明则 for..do..done 直接解析失败（前端门在半数矩阵上名存实亡）
      - name: Lint (ruff，版本 pin 防规则漂移)
        run: |
          pip install ruff==0.16.9
          ruff check src/ --select E9,F63,F7,F82 --ignore E402
      - name: Tests
        run: python -m pytest tests/ -v
      - name: Doctor（真实工具链自检，失败不吞——输出到 CI 摘要）
        # 旧写法 `|| true` 把失败静默吞掉（PROGRESS.md 欠账）：自检挂了没人知道。
        # doctor 是「报告型」命令：exit 0 = 全部就绪；非 0 = 有缺失（如 CI 无 mtr）。
        # 现改为失败时用 ::warning:: 显式标注到 job 页面，摘要里也留一行，不再静默。
        if: always()
        run: |
          set +e
          out=$(gpm doctor 2>&1); rc=$?
          echo "$out"
          if [ $rc -ne 0 ]; then
            echo "::warning::gpm doctor 退出码 $rc（CI 容器通常缺 mtr 等工具，属预期；完整工具链需实机验证）"
            echo "doctor-exit=$rc" >> $GITHUB_STEP_SUMMARY
          else
            echo "doctor-exit=0（工具链完整）" >> $GITHUB_STEP_SUMMARY
          fi
          exit 0
        shell: bash

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" mypy==2.3.1
      - name: Type check（零禁用项，见 pyproject [tool.mypy]）
        run: mypy src/gpm

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests with coverage（fail_under 见 pyproject [tool.coverage.report]）
        run: python -m pytest tests/ --cov=gpm --cov-report=term-missing

  ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" playwright
      - name: Install chromium + mtr（mtr-tiny 自带 cap_net_raw，非 root 可跑真 mtr）
        run: |
          sudo apt-get update
          sudo apt-get install -y mtr-tiny
          playwright install --with-deps chromium
      # ui_ci.py 自带完整编排：起一次性实例（双节点）→ 造任务/渠道/事件 →
      # 补种 6h 历史 → 跑 ui_acceptance.py 全量断言 → 清理进程与临时目录
      - name: Seeded instance + browser acceptance
        run: python scripts/ui_ci.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-acceptance-screenshots
          path: artifacts/ui-ci/
          retention-days: 7
