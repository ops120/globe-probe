# globe-probe 服务端/节点配置示例（复制为 config.yaml 使用）
# 敏感值优先环境变量：GPM_ADMIN_TOKEN / GPM_REGISTER_TOKEN

server:
  listen: "0.0.0.0:8620"
  database: "data/gpm.db"
  webui_dir: ""                    # 默认使用包内 webui/static
  admin_token: ""                  # 设置后写接口要求 X-Admin-Token
  ingest_batch_max: 500
  late_window_seconds: 300
  clock_skew_seconds: 120
  heartbeat_timeout: 60
  retention_raw_days: 30
  retention_1m_days: 90
  retention_5m_days: 180
  retention_1h_days: 730
  retention_hb_days: 7

agent:
  server_url: "http://127.0.0.1:8620"
  register_token: "gpm-dev-register"   # 生产请用 GPM_REGISTER_TOKEN 环境变量
  name: "bj-ct-01"
  tags: { region: "cn-north", isp: "telecom" }
  data_dir: "data/agent"
  heartbeat_interval: 15
  poll_interval: 10
  report_batch_size: 50
  report_interval: 5
  offline_buffer_max: 5000

probe:
  min_interval_seconds: 10         # ping/curl 间隔下限（需求约束）
  min_mtr_interval_seconds: 60
  ping_count: 4
  ping_timeout: 2.0
  curl_timeout: 10.0
  curl_expected_status: [[200, 300]]
  mtr_cycles: 10
  mtr_max_hops: 30
  mtr_timeout: 45.0
  dns_timeout: 2.0
  dns_cache_ttl: 60
  dns_cache_max: 300
  fail_threshold: 3                # 连续失败 N 次开启事件
  recover_threshold: 2             # 连续成功 N 次恢复
  jitter_ratio: 0.1

logging:
  level: "INFO"
  file: ""
