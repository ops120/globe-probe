[build-system]
requires = ["setuptools>=68", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "gpm"
# 版本号由 setuptools_scm 从 git tag/提交动态生成：
#   打了 tag:  v0.2.0（strip 自动去 v）
#   未打 tag:  0.2.0.devNN+gSHA（最近 tag + N 个提交 + 短 hash）
#   - 没有 git 仓库时回退到 DEFAULT_VERSION。
# 在运行时由 gpm.__init__ 读取 PKG-INFO 或 fallback，**避免到处硬编码版本号**。
dynamic = ["version"]
description = "globe-probe - 全球拨测监控平台 (distributed synthetic monitoring: ping/curl/mtr)"
authors = [{ name = "ops120", email = "ops120@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
]

# 项目主页 / 源码（作者：ops120）
[project.urls]
Homepage = "https://github.com/ops120/globe-probe"
Repository = "https://github.com/ops120/globe-probe"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pytest-cov>=5"]
# 节点资源采集（CPU/内存心跳）。缺失时如实上报 null，不影响拨测。
stats = ["psutil>=5.9"]

[project.scripts]
gpm = "gpm.cli:main"

[tool.setuptools_scm]
# 起始版本：没有 tag 时从这里起算
fallback_version = "0.1.0"
# 允许 0.x.y 在没有 git tag 时直接读 fallback_version
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gpm.webui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/gpm"]     # 显式指向 src 布局，避免统计到 site-packages 里的旧副本
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 68          # 实测 74.95%（2026-10-03，398 用例，含分支）；只许抬不许降

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false     # 主体无注解，先查模块级/已注解路径（随重构逐步收紧）
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
